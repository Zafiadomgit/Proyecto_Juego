<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140c3f" />
    <title>Joya Bloques</title>
  </head>
  <body>
    <div id="app">
      <section id="menu" class="screen active">
        <header class="topbar">
          <div class="wallet">
            <span class="pill"><i data-icon="coin"></i><b data-bind="coins">0</b></span>
            <span class="pill"><i data-icon="gem"></i><b data-bind="gems">0</b></span>
          </div>
          <button class="icon-btn" data-action="settings" aria-label="Ajustes"><i data-icon="settings"></i></button>
        </header>
        <div class="logo">
          <div class="logo-mark" aria-hidden="true">
            <i class="lb red"></i><i class="lb yellow"></i><i class="lb blue"></i><i class="lb green"></i>
            <span class="logo-gem" data-icon="gem"></span>
          </div>
          <h1 class="wordmark">Joya<br /><span>Bloques</span></h1>
          <p class="best">Récord: <b data-bind="best">0</b></p>
        </div>
        <nav class="menu-buttons">
          <button class="btn big primary" data-action="play-classic"><i data-icon="play"></i>Jugar</button>
          <button class="btn big adventure" data-action="play-adventure"><i data-icon="map"></i>Aventura · Nivel <b data-bind="level">1</b></button>
          <button class="btn big daily" data-action="play-daily"><i data-icon="calendar"></i>Reto diario <small data-bind="dailyBest"></small></button>
          <div class="row">
            <button class="btn secondary" data-action="themes"><i data-icon="palette"></i>Temas</button>
            <button class="btn secondary" data-action="shop"><i data-icon="cart"></i>Tienda</button>
            <button class="btn secondary gift" data-action="daily-reward" aria-label="Regalo diario"><i data-icon="gift"></i><span class="dot hidden" data-bind="giftDot"></span></button>
          </div>
        </nav>
      </section>

      <section id="game" class="screen">
        <header class="hud">
          <button class="icon-btn" data-action="pause" aria-label="Pausa"><i data-icon="pause"></i></button>
          <div class="score-box">
            <div class="score" data-bind="score">0</div>
            <div class="sub" data-bind="goal"></div>
          </div>
          <span class="pill"><i data-icon="coin"></i><b data-bind="coins">0</b></span>
        </header>
        <div class="canvas-wrap"><canvas id="board"></canvas></div>
        <footer class="boosters">
          <button class="booster" data-action="hammer" aria-label="Martillo"><i data-icon="hammer"></i><b data-bind="hammers">0</b></button>
        </footer>
      </section>

      <div id="toast" class="toast hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
